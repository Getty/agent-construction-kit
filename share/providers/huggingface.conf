# Hugging Face Inference Providers through its Anthropic-compatible API. Values follow its Claude Code guide (https://huggingface.co/docs/inference-providers/integrations/claude-code, read 2026-11).
# Override any value in huggingface.conf in the providers directory under the kit's config directory (default ~/.config/agent-construction-kit/providers/) or via ACK_HUGGINGFACE_<KEY>.
# MODEL takes any model the router serves; a suffix picks the provider (":cheapest", ":fastest", ":fireworks-ai").
DESCRIPTION=Hugging Face Inference Providers
PREFIX=ACK_HUGGINGFACE
KEY_VAR=HF_TOKEN
BASE_URL=https://router.huggingface.co
MODEL=zai-org/GLM-5.1
OPUS_MODEL=${MODEL}
SONNET_MODEL=${MODEL}
HAIKU_MODEL=${MODEL}
SMALL_MODEL=${MODEL}
CO_AUTHORED_BY=${MODEL}
MAX_THINKING_TOKENS=0
UNKNOWN_MODEL_WINDOW=1
API_TIMEOUT_MS=3000000
MAX_TOOL_CHAR_BUDGET=48000
DISABLE_NONESSENTIAL_TRAFFIC=1
DISABLE_EXPERIMENTAL_BETAS=1
TOOL_SEARCH=false
