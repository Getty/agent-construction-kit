# Novita AI through its Anthropic-compatible API. Values follow its Claude Code guide (https://docs.novita.ai/guides/claude-code, read 2026-11).
# Override any value in novita.conf in the providers directory under the kit's config directory (default ~/.config/agent-construction-kit/providers/) or via ACK_NOVITA_<KEY>.
DESCRIPTION=Novita AI
UNTESTED=1
PREFIX=ACK_NOVITA
KEY_VAR=NOVITA_API_KEY
BASE_URL=https://api.novita.ai/anthropic
MODEL=moonshotai/kimi-k3.1-pro
OPUS_MODEL=${MODEL}
SONNET_MODEL=${MODEL}
HAIKU_MODEL=deepseek/deepseek-v4.1-flash
SMALL_MODEL=${HAIKU_MODEL}
CO_AUTHORED_BY=${MODEL}
UNKNOWN_MODEL_WINDOW=1
API_TIMEOUT_MS=3000000
MAX_TOOL_CHAR_BUDGET=48000
DISABLE_NONESSENTIAL_TRAFFIC=1
DISABLE_EXPERIMENTAL_BETAS=1
TOOL_SEARCH=false
