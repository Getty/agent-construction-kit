# Moonshot AI Kimi through its Anthropic-compatible API.
# Override any value in kimi.conf in the providers directory under the kit's config directory (default ~/.config/agent-construction-kit/providers/) or via MOONSHOT_<KEY>.
DESCRIPTION=Moonshot AI Kimi
PREFIX=MOONSHOT
KEY_VAR=MOONSHOT_API_KEY
BASE_URL=https://api.moonshot.ai/anthropic
MODEL=kimi-k3[1m]
OPUS_MODEL=${MODEL}
SONNET_MODEL=${MODEL}
HAIKU_MODEL=${MODEL}
FABLE_MODEL=${MODEL}
SMALL_MODEL=${MODEL}
SUBAGENT_MODEL=${MODEL}
CO_AUTHORED_BY=${MODEL}
CONTEXT_WINDOW=1048576
AUTOCOMPACT_PCT=70
MAX_OUTPUT_TOKENS=131072
EFFORT_LEVEL=max
API_TIMEOUT_MS=3000000
MAX_TOOL_CHAR_BUDGET=48000
DISABLE_NONESSENTIAL_TRAFFIC=1
DISABLE_EXPERIMENTAL_BETAS=1
TOOL_SEARCH=false
