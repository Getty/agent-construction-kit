# DeepSeek through its Anthropic-compatible API. Values follow its Claude Code guide (https://api-docs.deepseek.com/quick_start/agent_integrations/claude_code, read 2026-11).
# Override any value in deepseek.conf in the providers directory under the kit's config directory (default ~/.config/agent-construction-kit/providers/) or via ACK_DEEPSEEK_<KEY>.
DESCRIPTION=DeepSeek
UNTESTED=1
PREFIX=ACK_DEEPSEEK
KEY_VAR=DEEPSEEK_API_KEY
BASE_URL=https://api.deepseek.com/anthropic
MODEL=deepseek-flash[1m]
OPUS_MODEL=${MODEL}
SONNET_MODEL=${MODEL}
HAIKU_MODEL=deepseek-flash
SMALL_MODEL=${HAIKU_MODEL}
SUBAGENT_MODEL=${HAIKU_MODEL}
CO_AUTHORED_BY=${MODEL}
CONTEXT_WINDOW=786432
AUTOCOMPACT_PCT=70
EFFORT_LEVEL=max
API_TIMEOUT_MS=3000000
MAX_TOOL_CHAR_BUDGET=48000
DISABLE_NONESSENTIAL_TRAFFIC=1
DISABLE_EXPERIMENTAL_BETAS=1
TOOL_SEARCH=false
