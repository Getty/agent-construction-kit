# Synthetic through its Anthropic-compatible API. Values follow its Claude Code guide (https://dev.synthetic.new/docs/guides/claude-code, read 2026-11).
# Override any value in synthetic.conf in the providers directory under the kit's config directory (default ~/.config/agent-construction-kit/providers/) or via ACK_SYNTHETIC_<KEY>.
DESCRIPTION=Synthetic (open models, flat subscription)
UNTESTED=1
PREFIX=ACK_SYNTHETIC
KEY_VAR=SYNTHETIC_API_KEY
BASE_URL=https://api.synthetic.new/anthropic
MODEL=syn:large:vision
OPUS_MODEL=${MODEL}
SONNET_MODEL=${MODEL}
HAIKU_MODEL=syn:small:text
SMALL_MODEL=${HAIKU_MODEL}
SUBAGENT_MODEL=${MODEL}
CO_AUTHORED_BY=${MODEL}
UNKNOWN_MODEL_WINDOW=1
API_TIMEOUT_MS=3000000
MAX_TOOL_CHAR_BUDGET=48000
DISABLE_NONESSENTIAL_TRAFFIC=1
DISABLE_EXPERIMENTAL_BETAS=1
TOOL_SEARCH=false
