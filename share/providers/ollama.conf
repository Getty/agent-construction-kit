# Ollama Cloud through its Anthropic-compatible API.
# Override any value in ollama.conf in the providers directory under the kit's config directory (default ~/.config/agent-construction-kit/providers/) or via ACK_OLLAMA_<KEY>.
DESCRIPTION=Ollama Cloud
PREFIX=ACK_OLLAMA
KEY_VAR=OLLAMA_CLOUD_API_KEY
BASE_URL=https://ollama.com
MODEL=deepseek-v4-flash
OPUS_MODEL=${MODEL}
SONNET_MODEL=${MODEL}
HAIKU_MODEL=${MODEL}
SMALL_MODEL=${MODEL}
CO_AUTHORED_BY=${MODEL}
CONTEXT_WINDOW=800000
AUTOCOMPACT_PCT=70
MAX_OUTPUT_TOKENS=64000
MAX_THINKING_TOKENS=32000
API_TIMEOUT_MS=3000000
MAX_TOOL_CHAR_BUDGET=48000
DISABLE_NONESSENTIAL_TRAFFIC=1
DISABLE_EXPERIMENTAL_BETAS=1
TOOL_SEARCH=false
