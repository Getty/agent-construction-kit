# Fireworks AI through its Anthropic-compatible API.
# Override any value in fireworks.conf in the providers directory under the kit's config directory (default ~/.config/agent-construction-kit/providers/) or via FIREWORKS_<KEY>.
DESCRIPTION=Fireworks AI
PREFIX=FIREWORKS
KEY_VAR=FIREWORKS_API_KEY
BASE_URL=https://api.fireworks.ai/inference
OPUS_MODEL=accounts/fireworks/models/glm-5p2
SONNET_MODEL=${OPUS_MODEL}
HAIKU_MODEL=accounts/fireworks/models/glm-5p1
SUBAGENT_MODEL=${HAIKU_MODEL}
MODEL=${OPUS_MODEL}
SMALL_MODEL=${HAIKU_MODEL}
CO_AUTHORED_BY=${OPUS_MODEL} via Fireworks AI
CONTEXT_WINDOW=200000
AUTOCOMPACT_PCT=70
MAX_OUTPUT_TOKENS=64000
MAX_THINKING_TOKENS=32000
API_TIMEOUT_MS=3000000
MAX_TOOL_CHAR_BUDGET=48000
DISABLE_NONESSENTIAL_TRAFFIC=1
DISABLE_EXPERIMENTAL_BETAS=1
TOOL_SEARCH=false
