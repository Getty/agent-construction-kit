# OpenAI models through a local claude-code-proxy (ChatGPT subscription).
# Override any value in openai.conf in the providers directory under the kit's config directory (default ~/.config/agent-construction-kit/providers/) or via ACK_OPENAI_<KEY>.
DESCRIPTION=OpenAI through claude-code-proxy (ChatGPT subscription)
PREFIX=ACK_OPENAI
KEY_REQUIRED=0
AUTH_TOKEN=proxy
PREFLIGHT=proxy
PROXY_PORT=18765
BASE_URL=http://127.0.0.1:${PROXY_PORT}
OPUS_MODEL=gpt-5.6-sol
SONNET_MODEL=gpt-5.6-terra
HAIKU_MODEL=gpt-5.6-luna
FABLE_MODEL=gpt-6-astra
SMALL_MODEL=gpt-5.6-luna
MODEL=${OPUS_MODEL}
OPUS_MODEL_NAME=GPT-5.6 Sol
SONNET_MODEL_NAME=GPT-5.6 Terra
HAIKU_MODEL_NAME=GPT-5.6 Luna
FABLE_MODEL_NAME=GPT-6 Astra
CO_AUTHORED_BY=${MODEL}
UNKNOWN_MODEL_WINDOW=1
