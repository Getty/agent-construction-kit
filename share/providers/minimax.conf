# MiniMax through its Anthropic-compatible API.
# Override any value in minimax.conf in the providers directory under the kit's config directory (default ~/.config/agent-construction-kit/providers/) or via MINIMAX_<KEY>.
DESCRIPTION=MiniMax (Anthropic-compatible API)
PREFIX=MINIMAX
KEY_VAR=MINIMAX_API_KEY
BASE_URL=https://api.minimax.io/anthropic
MODEL=MiniMax-M3.1-Flash
OPUS_MODEL=${MODEL}
SONNET_MODEL=${MODEL}
HAIKU_MODEL=${MODEL}
SMALL_MODEL=${MODEL}
CO_AUTHORED_BY=${MODEL} <model@minimax.io>
CONTEXT_WINDOW=800000
AUTOCOMPACT_PCT=70
MAX_OUTPUT_TOKENS=64000
MAX_THINKING_TOKENS=32000
API_TIMEOUT_MS=3000000
MAX_TOOL_CHAR_BUDGET=48000
DISABLE_NONESSENTIAL_TRAFFIC=1
DISABLE_EXPERIMENTAL_BETAS=1
TOOL_SEARCH=false
MCP_CONFIG=minimax.mcp.json
