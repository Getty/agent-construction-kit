# OpenRouter through its Anthropic-compatible API. Values follow its Claude Code guide (https://openrouter.ai/docs/guides/coding-agents/claude-code-integration, read 2026-11).
# Override any value in openrouter.conf in the providers directory under the kit's config directory (default ~/.config/agent-construction-kit/providers/) or via ACK_OPENROUTER_<KEY>.
# MODEL takes any id from https://openrouter.ai/models; "~vendor/name-latest" follows the vendor's newest model.
# OpenRouter says only Anthropic's own models are sure to work with Claude Code; others may fail on tools.
DESCRIPTION=OpenRouter (one key, many vendors)
UNTESTED=1
PREFIX=ACK_OPENROUTER
KEY_VAR=OPENROUTER_API_KEY
API_KEY_EMPTY=1
BASE_URL=https://openrouter.ai/api
MODEL=~anthropic/claude-sonnet-latest
OPUS_MODEL=~anthropic/claude-opus-latest
SONNET_MODEL=${MODEL}
HAIKU_MODEL=~anthropic/claude-haiku-latest
SMALL_MODEL=${HAIKU_MODEL}
CO_AUTHORED_BY=${MODEL}
API_TIMEOUT_MS=3000000
