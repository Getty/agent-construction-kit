# Alibaba Cloud Model Studio (Qwen), Coding Plan, international through its Anthropic-compatible API. Values follow its Claude Code guide (https://www.alibabacloud.com/help/en/model-studio/claude-code, read 2026-11).
# Override any value in qwen.conf in the providers directory under the kit's config directory (default ~/.config/agent-construction-kit/providers/) or via ACK_QWEN_<KEY>.
# A key belongs to one plan. For another plan or the China region, set BASE_URL to the address that page gives for it.
DESCRIPTION=Alibaba Qwen (Coding Plan, international)
UNTESTED=1
PREFIX=ACK_QWEN
KEY_VAR=DASHSCOPE_API_KEY
BASE_URL=https://coding-intl.dashscope.aliyuncs.com/apps/anthropic
MODEL=qwen3.7-plus
OPUS_MODEL=${MODEL}
SONNET_MODEL=${MODEL}
HAIKU_MODEL=${MODEL}
SMALL_MODEL=${MODEL}
CO_AUTHORED_BY=${MODEL}
CONTEXT_WINDOW=1000000
MAX_CONTEXT_TOKENS=1000000
AUTOCOMPACT_PCT=70
API_TIMEOUT_MS=3000000
MAX_TOOL_CHAR_BUDGET=48000
DISABLE_NONESSENTIAL_TRAFFIC=1
DISABLE_EXPERIMENTAL_BETAS=1
TOOL_SEARCH=false
