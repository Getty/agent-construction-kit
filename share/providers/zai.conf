# Z.ai GLM (coding plan) through its Anthropic-compatible API. Values follow its Claude Code guide (https://docs.z.ai/devpack/tool/claude, read 2026-11).
# Override any value in zai.conf in the providers directory under the kit's config directory (default ~/.config/agent-construction-kit/providers/) or via ACK_ZAI_<KEY>.
DESCRIPTION=Z.ai GLM
UNTESTED=1
PREFIX=ACK_ZAI
KEY_VAR=ZAI_API_KEY
BASE_URL=https://api.z.ai/api/anthropic
MODEL=glm-5.3[1m]
OPUS_MODEL=${MODEL}
SONNET_MODEL=${MODEL}
HAIKU_MODEL=glm-5.3-flash[1m]
SMALL_MODEL=${HAIKU_MODEL}
CO_AUTHORED_BY=${MODEL}
CONTEXT_WINDOW=1000000
MAX_CONTEXT_TOKENS=1000000
AUTOCOMPACT_PCT=70
API_TIMEOUT_MS=3000000
MAX_TOOL_CHAR_BUDGET=48000
DISABLE_NONESSENTIAL_TRAFFIC=1
DISABLE_EXPERIMENTAL_BETAS=1
TOOL_SEARCH=false
